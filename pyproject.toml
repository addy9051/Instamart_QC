[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insta-audit"
version = "0.1.0"
description = "Edge-oriented retail packing and inwarding quality audit service"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary project code; dataset/model licenses remain separate" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "PyYAML>=6,<7",
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
api = []
vision = ["torch>=2.4,<3", "torchvision>=0.19,<1", "transformers>=4.45,<5", "faiss-cpu>=1.8,<2"]
training = ["ultralytics>=8.3,<9", "scikit-learn>=1.5,<2", "albumentations>=1.4,<3", "tqdm>=4.66,<5"]
ocr = ["paddleocr>=2.9,<3"]
onnx = ["onnxruntime>=1.18,<2"]
s3 = ["boto3>=1.34,<2"]
dev = ["ruff>=0.8,<1", "mypy>=1.13,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
